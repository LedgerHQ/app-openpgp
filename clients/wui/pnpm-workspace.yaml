# pnpm 11 reads settings from here (not the package.json "pnpm" field nor, for
# these keys, .npmrc).

# Dependencies whose postinstall build scripts are allowed to run. esbuild
# needs to install its platform binary; the others are harmless to allow.
allowBuilds:
  esbuild: true

# Patched versions of transitive dependencies flagged by Dependabot.
overrides:
  postcss-selector-parser: "^6.1.5"
  source-map-js: "^1.2.2"
  undici: "^7.30.1"
