name: Generate GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'doc/**'
      - 'clients/wui/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'clients/wui/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  # One lock per pull request, and a separate one for the deployments.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pages-pr-{0}', github.event.pull_request.number)
        || format('pages-deploy-{0}', github.ref) }}
  # Superseding a pull request's own run is fine; a deployment in flight is not interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    # The install and build steps run scripts from the checked-out branch.
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Generate HTML
        run: doc/generate_html.sh

      # Build the backup/restore web UI and publish it under the same Pages
      # site, at <pages-url>/wui/.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Node >= 22.5: pnpm 11 loads node:sqlite, which older Node lacks.
          node-version: '22'

      - name: Build the backup web UI
        working-directory: clients/wui
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          # pnpm is provisioned by corepack from the "packageManager" field.
          corepack enable
          # --frozen-lockfile: install exactly what pnpm-lock.yaml pins (fail on drift).
          pnpm install --frozen-lockfile
          pnpm build

      - name: Add the web UI to the Pages artifact
        run: |
          mkdir -p doc/html/build/wui
          cp -r clients/wui/dist/. doc/html/build/wui/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/html/build/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
